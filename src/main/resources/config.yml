# Discord Webhook URL (required)
# Create one in Discord: Channel Settings > Integrations > Webhooks > New Webhook
webhook-url: ""

# Default bot display name (used when no player-specific name applies)
bot-name: "Minecraft Server"

# Toggle individual event types
events:
  player-join: true
  player-leave: true
  player-death: true
  player-advancement: true

# Embed colors (decimal RGB values)
colors:
  join: 5763719       # Green (#57F287)
  leave: 15548997     # Red (#ED4245)
  death: 2303786      # Dark (#23272A)
  advancement: 15844367  # Gold (#F1C40F)
