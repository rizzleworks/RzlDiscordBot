name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# A fork PR's token is read-only regardless of what is requested here, so the
# reporting steps live in report.yml, which runs with a grantable token.
permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-java@v5
              with:
                  distribution: corretto
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v6

            - run: ./gradlew test jacocoTestReport --no-daemon

            # report.yml cannot resolve the PR number itself: workflow_run only
            # populates pull_requests for same-repo PRs, and it is empty for forks.
            - name: Record the PR number
              if: github.event_name == 'pull_request'
              run: echo "${{ github.event.number }}" > pr-number.txt

            - uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: |
                      build/test-results/test/TEST-*.xml
                      build/reports/jacoco/test/jacocoTestReport.xml
                      pr-number.txt
                  if-no-files-found: error

            - run: ./gradlew shadowJar --no-daemon

    build-from-export:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v5
              with:
                  distribution: corretto
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v6

            # create a "gitless" environment for running the build
            # ensures gradle has no hard dep on git
            - name: Export the tree without .git
              run: |
                  mkdir -p "$RUNNER_TEMP/export"
                  git archive HEAD | tar -x -C "$RUNNER_TEMP/export"

            - name: Build from the export
              working-directory: ${{ runner.temp }}/export
              run: ./gradlew shadowJar --no-daemon

            - name: Check the version fell back
              working-directory: ${{ runner.temp }}/export
              run: |
                  unzip -p build/libs/*.jar paper-plugin.yml | grep -F "version: '0.0.0-dev'"
