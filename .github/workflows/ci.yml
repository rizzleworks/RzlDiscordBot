name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    checks: write
    pull-requests: write

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-java@v5
              with:
                  distribution: corretto
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v6

            - run: ./gradlew test jacocoTestReport --no-daemon

            - uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: Test Results
                  path: '**/test-results/test/TEST-*.xml'
                  reporter: java-junit

            - uses: madrapps/jacoco-report@v1.8.0
              if: github.event_name == 'pull_request'
              with:
                  paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
                  token: ${{ secrets.GITHUB_TOKEN }}
                  title: Code Coverage
                  min-coverage-overall: 0
                  min-coverage-changed-files: 0
                  update-comment: true

            - run: ./gradlew shadowJar --no-daemon

    build-from-export:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v5
              with:
                  distribution: corretto
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v6

            # Mirrors the source zip GitHub attaches to every release: no .git,
            # so the version must fall back instead of failing the build.
            - name: Export the tree without .git
              run: |
                  mkdir -p "$RUNNER_TEMP/export"
                  git archive HEAD | tar -x -C "$RUNNER_TEMP/export"

            - name: Build from the export
              working-directory: ${{ runner.temp }}/export
              run: ./gradlew shadowJar --no-daemon

            - name: Check the version fell back
              working-directory: ${{ runner.temp }}/export
              run: unzip -p build/libs/*.jar paper-plugin.yml | grep -F "version: '0.0.0-dev'"
