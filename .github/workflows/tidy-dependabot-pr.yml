name: Tidy Dependabot PR

# Squash merges use the PR body as the commit message and Dependabot's body is
# a mess of HTML. This trims to a compare link and moves details into a comment
on:
    pull_request:
        # synchronize re-tidies after `@dependabot recreate`, which restores the body.
        types: [opened, reopened, synchronize]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions: {}

jobs:
    tidy:
        runs-on: ubuntu-latest
        if: github.event.pull_request.user.login == 'dependabot[bot]'

        # Dependabot runs get a read-only token unless the workflow asks for more.
        permissions:
            pull-requests: write

        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

        steps:
            # Read fresh rather than from the event payload which can be stale
            - name: Fetch the current body
              run: gh api "repos/$REPO/pulls/$PR" --jq .body > body.md

            - name: Build the summary and the comment
              id: build
              shell: python
              run: |
                  import os, re, subprocess

                  MARKER = "<!-- tidy-dependabot-pr -->"
                  HEADER = (
                      "Dependabot's original description, moved out of the PR body so it "
                      "doesn't end up in the squash commit message."
                  )
                  SHA = r"[0-9a-f]{40}"

                  def resolve(repo, tag):
                      r = subprocess.run(["gh", "api", f"repos/{repo}/commits/{tag}", "--jq", ".sha"],
                                         capture_output=True, text=True)
                      return r.stdout.strip() if r.returncode == 0 else None

                  # SHA-pinned actions get a SHA range. Swap in tags only if both resolve to those exact commits.
                  def tag_compare(url, first):
                      m = re.fullmatch(rf"(https://github\.com/([^/]+/[^/]+)/compare/)({SHA})\.\.\.({SHA})", url)
                      v = re.search(r" from (\S+) to (\S+?)\.?$", first)
                      if not (m and v):
                          return None
                      tags = []
                      for version, sha in ((v.group(1), m.group(3)), (v.group(2), m.group(4))):
                          tag = next((t for t in (f"v{version}", version) if resolve(m.group(2), t) == sha), None)
                          if not tag:
                              return None
                          tags.append(tag)
                      return f"{m.group(1)}{tags[0]}...{tags[1]}"

                  body = open("body.md", encoding="utf-8").read().replace("\r\n", "\n")
                  tidy = "<details>" in body

                  if tidy:
                      first = body.split("\n", 1)[0].strip()

                      # Dependabot's own full-range link. Quoted release notes carry their own
                      # compare links for narrower ranges, so the first URL found can be wrong.
                      # Grouped updates bump several dependencies, so one link would mislead.
                      compare = None
                      if first.startswith("Bumps ["):
                          m = re.search(r'href="(https://github\.com/[^"]+/compare/[^"]+)">compare view</a>', body)
                          compare = m.group(1) if m else None
                      if compare:
                          compare = tag_compare(compare, first) or compare

                      # The commit subject already names the bump, so the body is just the link.
                      with open("summary.md", "w", encoding="utf-8") as f:
                          f.write(compare or "")

                      # Everything below the --- is Dependabot's command list. Re-posting
                      # it could let the bot read those lines as commands.
                      lines = body.split("\n")
                      cut = lines.index("---") if "---" in lines else len(lines)
                      kept = [l for l in lines[:cut] if "@dependabot" not in l]
                      with open("comment.md", "w", encoding="utf-8") as f:
                          f.write(f"{MARKER}\n{HEADER}\n\n" + "\n".join(kept).rstrip() + "\n")

                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write(f"tidy={'true' if tidy else 'false'}\n")

            # Comment before editing the body, so a failure never loses the notes.
            # Updating the earlier comment keeps a recreate from posting a duplicate.
            - name: Post or update the release notes comment
              if: steps.build.outputs.tidy == 'true'
              run: |
                  id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                      --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- tidy-dependabot-pr -->"))) | .id' \
                      | head -n 1)
                  if [ -n "$id" ]; then
                      gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
                  else
                      gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
                  fi

            - name: Replace the PR body with the summary
              if: steps.build.outputs.tidy == 'true'
              run: gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@summary.md > /dev/null
