version: 2
updates:
    - package-ecosystem: gradle
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      labels:
          - chore
      # paper-api's version is the target Minecraft version, not a library
      # version. Bump it by hand when the server moves.
      ignore:
          - dependency-name: 'io.papermc.paper:*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      labels:
          - chore
