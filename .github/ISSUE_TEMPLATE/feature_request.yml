name: Feature request
description: Suggest new behavior or configuration
labels: [feature]
body:
    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do
          description: The situation you are in, not the solution you have in mind.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: What you would like the plugin to do
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Anything you have tried instead
          description: Other plugins, config workarounds, or a fork.
