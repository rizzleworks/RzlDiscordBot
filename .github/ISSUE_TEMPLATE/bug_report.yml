name: Bug report
description: Something the plugin does wrong
labels: [bug]
body:
    - type: textarea
      id: what-happened
      attributes:
          label: What happened
          description: What you expected, and what happened instead.
      validations:
          required: true

    - type: textarea
      id: repro
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Set advancement notifications to enabled
              2. Earn an advancement
              3. No embed appears in Discord
      validations:
          required: true

    - type: input
      id: plugin-version
      attributes:
          label: Plugin version
          description: From the JAR filename or the startup log.
      validations:
          required: true

    - type: input
      id: server-version
      attributes:
          label: Server version
          description: Output of /version.
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Relevant log output
          description: Redact your webhook URL before pasting anything.
          render: text

    - type: textarea
      id: config
      attributes:
          label: Config
          description: Your config.yml with the webhook URL removed.
          render: yaml

    - type: textarea
      id: other-plugins
      attributes:
          label: Other plugins installed
          description: Output of /plugins. Another plugin consuming an event is a common cause.
